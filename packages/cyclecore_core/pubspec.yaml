name: cyclecore_core
description: >
  Infraestructura compartida de CycleCore: tema/design system, base de datos
  local (Drift), motor de lógica difusa de fusión de altitud, lectura de
  teselas SRTM y providers base. No depende de ningún feature de la app.
publish_to: 'none'

version: 1.0.0

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # --- Estado / reactividad ---
  flutter_riverpod: ^2.5.1

  # --- Persistencia local (offline-first) ---
  drift: ^2.20.3
  path_provider: ^2.1.4
  path: ^1.9.0

  # --- Sensores del dispositivo (barómetro) ---
  sensors_plus: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # --- Generación de código para Drift ---
  drift_dev: ^2.20.3
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
