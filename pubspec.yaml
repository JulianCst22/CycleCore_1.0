name: cyclecore_app
description: "CycleCore — ciclocomputador offline-first para ciclismo de ruta."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # --- Infraestructura compartida (tema, DB local, fuzzy engine, SRTM) ---
  cyclecore_core:
    path: packages/cyclecore_core

  # Cupertino
  cupertino_icons: ^1.0.8

  # --- Estado / reactividad ---
  flutter_riverpod: ^2.5.1

  # --- Mapas y geoespacial ---
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  geolocator_android: ^4.6.2

  # --- Segmentos: parseo de GPX (importar segmento / catálogo remoto) ---
  gpx: ^2.3.0

  # --- Segmentos: elegir el archivo .gpx local a importar ---
  file_picker: ^8.1.7

  # --- Sensores BLE ---
  flutter_blue_plus: ^1.32.12

  # --- Persistencia local (offline-first) ---
  drift: ^2.20.3
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # --- Voz (recomendaciones TTS) ---
  flutter_tts: ^4.0.2

  # --- Voz (reproducción de audios pre-grabados / voice packs) ---
  audioplayers: ^6.0.0

  # --- Conectividad ---
  connectivity_plus: ^6.0.5

  # --- Permisos ---
  permission_handler: ^11.3.1

  # --- Sensores del dispositivo ---
  sensors_plus: ^6.0.1

  # --- Descarga de teselas de elevación desde tu cloud ---
  http: ^1.2.2

  # --- Preferencias ---
  shared_preferences: ^2.3.2

  # --- Compartir ---
  share_plus: ^10.1.2

  # --- Selección de imágenes ---
  image_picker: ^1.2.0

  # --- Animaciones Lottie (pantalla de bienvenida animada) ---
  lottie: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # --- Tests: control del tiempo virtual (timers de reconexión BLE) ---
  fake_async: ^1.3.1

  # --- Generación de código para Drift ---
  drift_dev: ^2.20.3
  build_runner: ^2.4.12

flutter:
  uses-material-design: true

  assets:
    - assets/lottie/

  # Tipografía de la app -- Rubik (OFL). Un sans humanista con esquinas
  # sutilmente redondeadas: legible, cálido y de proporción ancha (nada
  # de condensadas). Se empaqueta local para no depender de internet
  # (objetivo offline-first). Es una fuente variable: un solo archivo
  # cubre de Light a Black; Flutter mapea `fontWeight` al eje `wght`.
  # Ver core/theme/cc_type.dart.
  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/rubik/Rubik-VariableFont_wght.ttf

  # Descomenta esto cuando agregues audios pre-grabados para el
  # módulo de voz (assets/voice_packs/<persona>/<evento>/0.mp3, etc.)
  # - assets/voice_packs/